[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zink-probe"
version = "0.1.0"
description = "macOS HP Sprocket Select diagnostics and bounded configuration research"
requires-python = ">=3.11"
dependencies = ["bleak>=1,<4", "pyobjc-framework-IOBluetooth>=11,<13; sys_platform == 'darwin'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
zink-probe = "zink_probe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
