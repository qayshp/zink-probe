name: iOS accessory probe build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-probe.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bounded identity wire handling
        run: |
          mkdir -p build
          swiftc ios/SelectAccessoryProbe/IdentityWire.swift ios/tests/main.swift -o build/ios-wire-tests
          build/ios-wire-tests
      - name: Check offline image preparation on Apple frameworks
        run: |
          python3 -m venv build/photo-venv
          build/photo-venv/bin/pip install Pillow
          swiftc ios/SelectAccessoryProbe/PhotoPreparation.swift ios/photo-tests/main.swift -o build/ios-photo-tests
          build/photo-venv/bin/python ios/photo-tests/check.py build/ios-photo-tests build/photo-fixtures
      - name: Compare Swift upload core against Python golden traces
        run: |
          PYTHONPATH=src python3 ios/print-tests/generate.py build/ios-upload-fixtures.json
          swiftc ios/PrintCore/UploadPlan.swift ios/print-tests/main.swift -o build/ios-upload-tests
          build/ios-upload-tests build/ios-upload-fixtures.json
      - name: Test durable iOS jobs with abrupt process exits
        run: |
          swiftc ios/PrintCore/*.swift ios/journal-tests/main.swift -o build/ios-journal-tests
          build/ios-journal-tests
      - name: Test preflight and framed accessory exchanges offline
        run: |
          swiftc ios/PrintCore/ReadOnlyPreflight.swift ios/preflight-tests/main.swift -o build/ios-preflight-tests
          build/ios-preflight-tests
      - name: Test full offline iOS submission and recovery
        run: |
          swiftc ios/PrintCore/*.swift ios/coordinator-tests/main.swift -o build/ios-coordinator-tests
          build/ios-coordinator-tests
      - name: Test confirmed Share-flow simulation and duplicate protection
        run: |
          swiftc -parse-as-library ios/PrintCore/*.swift ios/share-flow-tests/main.swift -o build/ios-share-flow-tests
          build/ios-share-flow-tests
      - name: Typecheck complete core for iOS
        run: >-
          xcrun swiftc -typecheck -target arm64-apple-ios16.0
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/PrintCore/*.swift
      - name: Compile for iPhone (no signing or device access)
        run: >-
          xcodebuild -project ios/SelectAccessoryProbe/SelectAccessoryProbe.xcodeproj
          -scheme SelectAccessoryProbe -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-probe CODE_SIGNING_ALLOWED=NO build
