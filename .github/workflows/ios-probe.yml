name: iOS accessory probe build
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-probe.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test bounded identity wire handling
        run: |
          mkdir -p build
          swiftc ios/SelectAccessoryProbe/IdentityWire.swift ios/tests/main.swift -o build/ios-wire-tests
          build/ios-wire-tests
      - name: Test read-only BLE framing, flow control and interruptions offline
        run: |
          mkdir -p build
          swiftc ios/BLECore/*.swift ios/ble-tests/main.swift -o build/ios-ble-tests
          build/ios-ble-tests
      - name: Typecheck read-only BLE core for iOS
        run: >-
          xcrun swiftc -typecheck -target arm64-apple-ios16.0
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/BLECore/*.swift
      - name: Check offline image preparation on Apple frameworks
        run: |
          python3 -m venv build/photo-venv
          build/photo-venv/bin/pip install Pillow
          swiftc ios/SelectAccessoryProbe/PhotoPreparation.swift ios/photo-tests/main.swift -o build/ios-photo-tests
          build/photo-venv/bin/python ios/photo-tests/check.py build/ios-photo-tests build/photo-fixtures
      - name: Compare Swift upload core against Python golden traces
        run: |
          PYTHONPATH=src python3 ios/print-tests/generate.py build/ios-upload-fixtures.json
          swiftc ios/PrintCore/UploadPlan.swift ios/print-tests/main.swift -o build/ios-upload-tests
          build/ios-upload-tests build/ios-upload-fixtures.json
      - name: Test durable iOS jobs with abrupt process exits
        run: |
          swiftc ios/PrintCore/*.swift ios/journal-tests/main.swift -o build/ios-journal-tests
          build/ios-journal-tests
      - name: Test preflight and framed accessory exchanges offline
        run: |
          swiftc ios/PrintCore/ReadOnlyPreflight.swift ios/preflight-tests/main.swift -o build/ios-preflight-tests
          build/ios-preflight-tests
      - name: Test full offline iOS submission and recovery
        run: |
          swiftc ios/PrintCore/*.swift ios/coordinator-tests/main.swift -o build/ios-coordinator-tests
          build/ios-coordinator-tests
      - name: Test confirmed Share-flow simulation and duplicate protection
        run: |
          swiftc -parse-as-library ios/PrintCore/*.swift ios/share-flow-tests/main.swift -o build/ios-share-flow-tests
          build/ios-share-flow-tests
      - name: Test read-only accessory adapter and durable bindings offline
        run: |
          swiftc ios/PrintCore/*.swift ios/accessory-tests/main.swift -o build/ios-accessory-tests
          build/ios-accessory-tests
      - name: Test one-job authorization, interruptions and persistent outcomes
        run: |
          swiftc ios/PrintCore/*.swift ios/authorization-tests/main.swift -o build/ios-authorization-tests
          build/ios-authorization-tests
      - name: Test private photo drafts and reopening offline
        run: |
          swiftc ios/PrintCore/*.swift ios/BLEOnlyProbe/BLEPilotDraftStore.swift ios/ble-pilot-draft-tests/main.swift -o build/ios-ble-pilot-draft-tests
          build/ios-ble-pilot-draft-tests
      - name: Test BLE submission transfers, interruptions and duplicate prevention offline
        run: |
          swiftc ios/PrintCore/*.swift ios/BLECore/*.swift ios/BLESubmission/*.swift ios/SelectAccessoryProbe/NativeBLEAdapter.swift ios/ble-submission-tests/main.swift -o build/ios-ble-submission-tests
          build/ios-ble-submission-tests
          swiftc -D ZINK_EXPERIMENTAL_BLE_PRINT ios/PrintCore/*.swift ios/BLECore/*.swift ios/BLESubmission/*.swift ios/SelectAccessoryProbe/NativeBLEAdapter.swift ios/ble-submission-tests/main.swift -o build/ios-ble-pilot-tests
          build/ios-ble-pilot-tests
      - name: Typecheck native BLE coordinator adapter for iOS and Share restrictions
        run: >-
          xcrun swiftc -typecheck -application-extension -target arm64-apple-ios16.0
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          ios/PrintCore/*.swift ios/BLECore/*.swift ios/BLESubmission/*.swift
          ios/SelectAccessoryProbe/NativeBLEAdapter.swift
      - name: Test strict BLE preflight UI and lifecycle offline
        run: |
          swiftc ios/PrintCore/*.swift ios/BLECore/*.swift ios/BLESubmission/*.swift ios/SelectAccessoryProbe/NativeBLEAdapter.swift ios/SelectAccessoryProbe/BLEPreflightController.swift ios/ble-preflight-tests/main.swift -o build/ios-ble-preflight-tests
          build/ios-ble-preflight-tests
      - name: Test the separate verified BLE clock action offline
        run: |
          swiftc ios/PrintCore/*.swift ios/BLECore/*.swift ios/BLESubmission/*.swift ios/ble-clock-tests/main.swift -o build/ios-ble-clock-tests
          build/ios-ble-clock-tests
      - name: Typecheck complete core for iOS
        run: >-
          xcrun swiftc -typecheck -target arm64-apple-ios16.0
          -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" ios/PrintCore/*.swift
      - name: Compile for iPhone (no signing or device access)
        run: >-
          xcodebuild -project ios/SelectAccessoryProbe/SelectAccessoryProbe.xcodeproj
          -scheme SelectAccessoryProbe -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-probe CODE_SIGNING_ALLOWED=NO build
      - name: Compile isolated BLE-only app and Share extension
        run: >-
          xcodebuild -project ios/BLEOnlyProbe/BLEOnlyProbe.xcodeproj
          -scheme BLEOnlyProbe -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-ble-only CODE_SIGNING_ALLOWED=NO build
      - name: Compile explicitly enabled BLE-only pilot app
        run: >-
          xcodebuild -project ios/BLEOnlyProbe/BLEOnlyProbe.xcodeproj
          -scheme BLEOnlyProbe -destination 'generic/platform=iOS'
          -derivedDataPath build/ios-ble-pilot CODE_SIGNING_ALLOWED=NO
          ZINK_BLE_PILOT_CONDITION=ZINK_EXPERIMENTAL_BLE_PRINT build
      - name: Verify isolated linkage and app-only pilot
        run: |
          python3 - <<'PY'
          import plistlib
          import subprocess
          from pathlib import Path
          for variant in ('ble-only', 'ble-pilot'):
              app = Path(f'build/ios-{variant}/Build/Products/Debug-iphoneos/BLEOnlyProbe.app')
              for bundle, executable in [(app, 'BLEOnlyProbe'), (app / 'PlugIns/BLEOnlyShare.appex', 'BLEOnlyShare')]:
                  info = plistlib.loads((bundle / 'Info.plist').read_bytes())
                  assert info['NSBluetoothAlwaysUsageDescription']
                  assert 'UISupportedExternalAccessoryProtocols' not in info
                  assert 'UIBackgroundModes' not in info
                  binary = bundle / executable
                  libraries = subprocess.check_output(['otool', '-L', str(binary)], text=True)
                  assert 'CoreBluetooth.framework' in libraries
                  assert 'ExternalAccessory.framework' not in libraries
                  app_pilot = variant == 'ble-pilot' and bundle == app
                  compiled = binary.read_bytes()
                  assert b'ZINK_PILOT_FIXTURE_SCENARIO' not in compiled, (variant, bundle)
                  for label in (b'Prepare one BLE print', b'Sync printer clock', b'Share last print report'):
                      assert (label in compiled) == app_pilot, (variant, bundle, label)
          print('Both variants use CoreBluetooth alone. Only the opted-in main app contains the print UI.')
          PY
  pilot-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the guided BLE pilot on a simulator
        run: |
          simulator="$(xcrun simctl list -j devices available | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(runtimes.items(), reverse=True):
              if ".iOS-" in runtime:
                  phone = next((device for device in devices if device["name"].startswith("iPhone") and device["isAvailable"]), None)
                  if phone:
                      print(phone["udid"])
                      break
          else:
              sys.exit("No iPhone simulator is available")
          ')"
          xcrun simctl bootstatus "$simulator" -b
          xcodebuild -project ios/BLEOnlyProbe/BLEOnlyProbe.xcodeproj \
            -scheme BLEOnlyProbe -destination "platform=iOS Simulator,id=$simulator" \
            -derivedDataPath build/ios-pilot-ui -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO ZINK_BLE_PILOT_CONDITION=ZINK_EXPERIMENTAL_BLE_PRINT test
