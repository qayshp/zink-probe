name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable core, offline image preparation and test tools
        run: python -m pip install -e ".[images,dev]" build
      - name: Lint
        run: python -m ruff check src tests
      - name: Formatting of portable engine and image preparation
        run: python -m ruff format --check src/zink_probe/jobs src/zink_probe/images.py src/zink_probe/prepare_cli.py tests/test_jobs.py tests/test_macos_stream.py tests/test_linux_stream.py tests/test_images.py tests/fixtures/images/make_profile.py
      - name: Test diagnostics, portable jobs and image preparation
        run: python -m pytest -q
      - name: Test earlier image research contract
        run: python -m unittest discover -s experiments/python-render -p "test_prepare.py"
      - name: Test bounded calibration transcripts without hardware
        run: python -m unittest discover -s experiments/calibration -p "test_*print*.py"
      - name: Simulate CAL-03 quality-100 4:4:4
        run: python -m zink_probe.jobs.cli experiments/jpeg-quality/q100-444-optimized.jpg --journal logs/ci-simulated.sqlite --name SELECT-CAL-03 --allow-alternative-sampling --encoder-quality 100
      - name: Prepare and preview an image offline through the installed CLI
        run: zink-prepare examples/image-preparation/source.png logs/ci-prepared --mode fit --quality 100 --subsampling 4:4:4
      - name: Simulate the newly prepared payload
        run: zink-simulate logs/ci-prepared/image.jpg --journal logs/ci-prepared.sqlite --name PREPARED --allow-alternative-sampling --encoder-quality 100
      - name: Build portable wheel
        run: python -m build --wheel
      - name: Validate macOS callback bindings without opening Bluetooth
        if: runner.os == 'macOS'
        run: |
          python -m pip install -e ".[macos]"
          python -m pytest -q tests/test_macos_stream.py::test_native_delegate_metadata_without_bluetooth_connection tests/test_extended.py::test_native_sdp_serializer
      - name: Validate Linux socket constants and D-Bus bindings without Bluetooth
        if: runner.os == 'Linux'
        run: |
          python -m pip install -e ".[linux]"
          python -m pytest -q tests/test_linux_stream.py::test_native_linux_dbus_message_without_bus_or_bluetooth
