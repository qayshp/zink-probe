name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install portable core and test tools, without Bluetooth dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: python -m ruff check src tests
      - name: Formatting of portable engine
        run: python -m ruff format --check src/zink_probe/jobs tests/test_jobs.py
      - name: Test diagnostics and portable job engine
        run: python -m pytest -q
      - name: Test bounded calibration transcripts without hardware
        run: python -m unittest discover -s experiments/calibration -p "test_*print*.py"
      - name: Simulate CAL-03 quality-100 4:4:4
        run: python -m zink_probe.jobs.cli experiments/jpeg-quality/q100-444-optimized.jpg --journal logs/ci-simulated.sqlite --name SELECT-CAL-03 --allow-alternative-sampling --encoder-quality 100
      - name: Build portable wheel
        run: python -m build --wheel
